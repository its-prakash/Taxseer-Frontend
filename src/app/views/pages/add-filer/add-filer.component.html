<aside class="panel show" id="panel" aria-hidden="false" aria-labelledby="panelTitle">
  <!-- Header -->
  <header>
    <h2 id="panelTitle">Add filer</h2>
    <button 
      class="btn ghost sm" 
      id="pClose" 
      aria-label="Close" 
      (click)="close()">
      ✕
    </button>
  </header>

  <!-- Panel Body -->
  <div class="pb">
    <!-- Payer Section -->
    <fieldset>
      <legend>Payer</legend>
      <div class="f">
        <label for="fl-name">Legal name</label>
        <input 
          id="fl-name" 
          type="text" 
          [(ngModel)]="filer.legalName" 
        />
        <span class="hint">As registered with the IRS for this EIN.</span>
      </div>

      <div class="row2">
        <div class="f">
          <label for="fl-ein">EIN</label>
          <input 
            id="fl-ein" 
            inputmode="numeric" 
            [(ngModel)]="filer.ein" 
            placeholder="12-3456789" 
          />
        </div>
        <div class="f">
          <label for="fl-phone">Phone</label>
          <input 
            id="fl-phone" 
            type="tel" 
            [(ngModel)]="filer.phone" 
          />
          <span class="hint">Printed on the payer box of 1099s.</span>
        </div>
      </div>
    </fieldset>

    <!-- Address Section -->
    <fieldset>
      <legend>Address</legend>
      <div class="f">
        <label for="fl-a1">Street address</label>
        <input 
          id="fl-a1" 
          type="text" 
          [(ngModel)]="filer.streetAddress" 
        />
      </div>

      <div class="f">
        <label for="fl-a2">Suite (optional)</label>
        <input 
          id="fl-a2" 
          type="text" 
          [(ngModel)]="filer.suite" 
        />
      </div>

      <div class="row3">
        <div class="f">
          <label for="fl-city">City</label>
          <input 
            id="fl-city" 
            type="text" 
            [(ngModel)]="filer.city" 
          />
        </div>
        <div class="f">
          <label for="fl-st">State</label>
          <select id="fl-st" [(ngModel)]="filer.state">
            <option value="">Select</option>
            <option *ngFor="let st of stateOptions" [value]="st.code">
              {{ st.code }} · {{ st.name }}
            </option>
          </select>
        </div>
        <div class="f">
          <label for="fl-zip">ZIP</label>
          <input 
            id="fl-zip" 
            inputmode="numeric" 
            [(ngModel)]="filer.zip" 
          />
        </div>
      </div>
    </fieldset>

    <!-- Filing Details Section -->
    <fieldset>
      <legend>Filing details</legend>
      <div class="row2">
        <div class="f">
          <label for="fl-email">Contact email</label>
          <input 
            id="fl-email" 
            type="email" 
            [(ngModel)]="filer.email" 
          />
          <span class="hint">Receives filing status updates.</span>
        </div>
        <div class="f">
          <label for="fl-stno">Payer state ID</label>
          <input 
            id="fl-stno" 
            type="text" 
            [(ngModel)]="filer.payerStateId" 
            placeholder="MD 12345678" 
          />
          <span class="hint">Pre-fills Box 6 on state copies.</span>
        </div>
      </div>
    </fieldset>
  </div>

  <!-- Footer Actions -->
  <footer>
    <button class="btn" id="pCancel" (click)="cancel()">Cancel</button>
    <button class="btn primary" id="pSave" (click)="saveFiler()">Add filer</button>
  </footer>
</aside>
